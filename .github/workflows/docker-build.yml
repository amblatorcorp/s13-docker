name: Build Docker image

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build --tag "s13-training-camps:${IMAGE_TAG}" .
